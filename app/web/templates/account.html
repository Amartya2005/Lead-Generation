{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<h1>Your account</h1>
<div class="card" style="max-width:420px">
  <p class="muted small">Signed in as <b>{{ user.username }}</b> ({{ user.member.name }}{% if user.is_admin %}, admin{% endif %}).</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="c">Current password</label>
    <input id="c" type="password" name="current" autocomplete="current-password" required>
    <label for="n">New password <span class="muted small">(at least 10 characters)</span></label>
    <input id="n" type="password" name="new" autocomplete="new-password" minlength="10" required>
    <label for="r">Repeat new password</label>
    <input id="r" type="password" name="repeat" autocomplete="new-password" minlength="10" required>
    <div class="actions"><button class="primary" type="submit">Change password</button></div>
  </form>
</div>
{% endblock %}
