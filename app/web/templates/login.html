{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login card">
  <h1>{{ company.short_name }}</h1>
  <p class="muted">Sign in to review outreach drafts.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="u">Username</label>
    <input id="u" type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="p">Password</label>
    <input id="p" type="password" name="password" autocomplete="current-password" required>
    <div class="actions"><button class="primary" type="submit">Sign in</button></div>
  </form>
  {% if first_run %}<p class="small muted">First time here? <a href="{{ url_for('setup') }}">Create the admin login</a>.</p>{% endif %}
</div>
{% endblock %}
