<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Lead Review{% endblock %} · {{ company.short_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if user %}
<header class="top"><div class="in">
  <a class="brand" href="{{ url_for('dashboard') }}">{{ company.short_name }} · Leads</a>
  <nav class="inline">
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Home</a>
    <a href="{{ url_for('leads', status='drafted') }}" class="{{ 'on' if request.endpoint in ('leads', 'lead_detail') }}">Drafts</a>
    <a href="{{ url_for('suppression') }}" class="{{ 'on' if request.endpoint == 'suppression' }}">Do-not-email</a>
    <a href="{{ url_for('team') }}" class="{{ 'on' if request.endpoint == 'team' }}">Team</a>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="small">Sign out {{ user.member.name }}</button>
    </form>
  </nav>
</div></header>
{% endif %}
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
