# Non-secret settings. Secrets (SMTP password, API keys) live in .env.
# Any value marked (env: NAME) can be overridden from .env.

llm:
  provider: gemini            # gemini | groq | xai | ollama | none   (env: LLM_PROVIDER)
  model: ""                   # blank = provider default below          (env: LLM_MODEL)
  default_models:            # first one is tried first; the rest are fallbacks on 404/503
    gemini: [gemini-3.8-flash, gemini-flash-latest, gemini-3.1-flash-lite]
    groq: [llama-3.3-70b-versatile]
    xai: [grok-3-mini]
    ollama: [llama3.1]
  requests_per_minute: 8      # stay under free-tier RPM
  max_calls_per_run: 150      # hard cap per pipeline run
  temperature: 0.4
  timeout_seconds: 60

crawl:
  # Identify yourself honestly. Put your own site in the URL.
  user_agent: "FocusTriggerLeadBot/1.0 (+https://focustriggerautomation.com)"
  per_host_delay_seconds: 6   # minimum gap between requests to one host (robots Crawl-delay wins if larger)
  timeout_seconds: 20
  max_pages_per_site: 3       # homepage + up to 2 contact/about/careers pages
  cache_hours: 72
  use_playwright_fallback: true
  max_body_chars: 600000

research:
  max_new_leads_per_run: 30
  queries_per_run: 8
  results_per_query: 10
  seconds_between_queries: [6, 12]   # random delay range between search calls
  sources: [duckduckgo]              # add google_cse if you have a free CSE key
  resolve_directory_listings: true   # turn IndiaMART/Justdial result titles into company websites
  keep_listings_without_website: false  # true = also save listings with no site (status no_website, phone follow-up)
  # Public directory listing pages you are allowed to crawl (robots.txt is still checked).
  # Outbound links on these pages become candidate companies.
  directory_pages: []
  #  - https://example-startup-directory.in/odisha

qualification:
  min_score: 6                # leads below this are discarded
  llm_weight: 0.4             # 0 = pure rules, 1 = pure LLM

email:
  max_words: 120
  use_llm: true               # false = deterministic template only

tick:
  # Serverless mode (Vercel): each GET /api/tick does this much work, then stops.
  budget_seconds: 240          # keep below the function's maxDuration (300 in vercel.json)
  min_interval_seconds: 240    # extra calls inside this window are ignored
  inbox_every_seconds: 7200
  reserve_seconds: 45

web:
  # Review page (python main.py web, or gunicorn on the server). Secrets: WEB_SECRET_KEY in .env.
  login_max_failures: 5        # per username, then locked for lockout_minutes
  lockout_minutes: 15
  session_hours: 12

sending:
  daily_limit: 25             # (env: DAILY_SEND_LIMIT)
  min_delay_seconds: 90       # random delay between sends
  max_delay_seconds: 300
  human_approval: true        # (env: HUMAN_APPROVAL)  only 'approved' drafts are sent
  dry_run: false              # (env: DRY_RUN)  log instead of sending
  max_per_domain: 1           # never email the same company twice
  send_window:
    timezone: Asia/Kolkata
    start_hour: 10
    end_hour: 18
    weekdays: [0, 1, 2, 3, 4, 5]   # Mon-Sat (0 = Monday)

storage:
  db_path: data/leads.db
  csv_report: output/leads.csv
  log_file: logs/run.log
  backup_dir: data/backups
  backup_keep_days: 14
  google_sheets:
    enabled: false
    spreadsheet: "Lead Outreach"
    worksheet: "leads"
    service_account_file: service_account.json

