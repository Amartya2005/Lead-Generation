# Non-secret settings. Secrets (SMTP password, API keys) live in .env.
# Any value marked (env: NAME) can be overridden from .env.

llm:
  provider: gemini            # gemini | groq | xai | ollama | none   (env: LLM_PROVIDER)
  model: ""                   # blank = provider default below          (env: LLM_MODEL)
  default_models:            # first one is tried first; the rest are fallbacks on 404/503
    gemini: [gemini-3.8-flash, gemini-flash-latest, gemini-3.1-flash-lite]
    groq: [llama-3.3-70b-versatile]
    xai: [grok-3-mini]
    ollama: [llama3.1]
  requests_per_minute: 8      # stay under free-tier RPM
  max_calls_per_run: 150      # hard cap per pipeline run
  temperature: 0.4
  timeout_seconds: 60

crawl:
  # Identify yourself honestly. Put your own site in the URL.
  user_agent: "FocusTriggerLeadBot/1.0 (+https://focustriggerautomation.com)"
  per_host_delay_seconds: 6   # minimum gap between requests to one host (robots Crawl-delay wins if larger)
  timeout_seconds: 20
  max_pages_per_site: 3       # homepage + up to 2 contact/about/careers pages
  cache_hours: 72
  use_playwright_fallback: true
  max_body_chars: 600000

research:
  max_new_leads_per_run: 30
  queries_per_run: 8
  results_per_query: 10
  seconds_between_queries: [6, 12]   # random delay range between search calls
  sources: [duckduckgo]              # add google_cse if you have a free CSE key
  # Only used if you add site:justdial.com / site:indiamart.com templates back to icp.yaml.
  # A listing is kept only when its company's OWN website is found (strict name-in-domain match).
  resolve_directory_listings: true
  keep_listings_without_website: false  # true = also save listings with no site (status no_website, phone follow-up)
  # Public directory listing pages you are allowed to crawl (robots.txt is still checked).
  # Outbound links on these pages become candidate companies.
  directory_pages: []
  #  - https://example-startup-directory.in/odisha
  # Extra discovery sources (app/sources/). Each is independent and OFF until you set enabled: true.
  # Results pass the same quality gate as search results, are deduplicated across sources
  # (domain, or company name + city) and keep their provenance (source, source_url, evidence).
  # A repeat sighting by another source is logged as a `seen_again` event on the existing lead.
  # Check them with `python main.py sources`; run one with `python main.py research --source osm`.
  # Deferred: X/Twitter (no free, compliant read access), Google Places (billed fields, storage limits).
  adapters:
    osm:                               # OpenStreetMap via the public Overpass API: free, no key
      enabled: false
      endpoint: https://overpass-api.de/api/interpreter
      max_requests_per_day: 4          # one ICP city per request; Overpass asks regular apps to stay far below 10k/day
      max_requests_per_run: 1
      cache_hours: 168                 # the same city isn't asked again for a week
      timeout_seconds: 60
      max_results_per_request: 150
      # Only businesses that list their own website, in these OSM categories:
      filters: ['["office"]', '["shop"]', '["craft"]', '["healthcare"]', '["industrial"]',
                '["amenity"~"^(clinic|dentist|doctors|hospital|school|college|training|driving_school)$"]']
    news_rss:                          # startup / SME news feeds -> the companies they report on
      enabled: false
      min_hours_between_fetches: 12
      max_items_per_feed: 30
      max_resolutions_per_day: 5       # website lookups via DuckDuckGo when the item has no company link
      # A feed is fetched ONLY with terms: permitted. Checked 2026-11-17 (feeds and robots.txt allow access):
      feeds:
        - name: inc42
          url: https://inc42.com/feed/
          terms: prohibited            # Terms of Use: no bot/automated program may "access, acquire, copy, or
                                       # monitor" content "without the prior express written consent of Inc42"
        - name: entrackr
          url: https://entrackr.com/rss
          terms: prohibited            # Terms of Use: no "systematic or automated data collection ... without our
                                       # express written consent"
        - name: yourstory
          url: https://yourstory.com/feed
          terms: unverified            # terms page is behind a bot challenge; read it yourself before permitting
        - name: yourstory_smbstory
          url: https://yourstory.com/smbstory/feed
          terms: unverified

qualification:
  min_score: 6                # leads below this are discarded
  llm_weight: 0.4             # 0 = pure rules, 1 = pure LLM

email:
  max_words: 120
  use_llm: true               # false = deterministic template only

tick:
  # Serverless mode (Vercel): each GET /api/tick does this much work, then stops.
  budget_seconds: 240          # keep below the function's maxDuration (300 in vercel.json)
  min_interval_seconds: 240    # extra calls inside this window are ignored
  inbox_every_seconds: 7200
  reserve_seconds: 45

web:
  # Review page (python main.py web, or gunicorn on the server). Secrets: WEB_SECRET_KEY in .env.
  login_max_failures: 5        # per username, then locked for lockout_minutes
  lockout_minutes: 15
  session_hours: 12

sending:
  # LEAD-GENERATION-ONLY MODE. false = no email is ever sent: `send`, `run --send`, /api/tick and the
  # review page's "test email" all refuse, no SMTP connection is opened, and dry_run is forced on.
  # Drafts are still written for human review. Deliberately NOT overridable from .env / Vercel env vars:
  # turning sending back on needs a reviewed change to this file.
  enabled: false
  daily_limit: 25             # (env: DAILY_SEND_LIMIT)
  min_delay_seconds: 90       # random delay between sends
  max_delay_seconds: 300
  human_approval: true        # (env: HUMAN_APPROVAL)  only 'approved' drafts are sent
  dry_run: true               # (env: DRY_RUN)  log instead of sending (always true while enabled: false)
  max_per_domain: 1           # never email the same company twice
  send_window:
    timezone: Asia/Kolkata
    start_hour: 10
    end_hour: 18
    weekdays: [0, 1, 2, 3, 4, 5]   # Mon-Sat (0 = Monday)

storage:
  db_path: data/leads.db
  csv_report: output/leads.csv
  log_file: logs/run.log
  backup_dir: data/backups
  backup_keep_days: 14
  google_sheets:
    enabled: false
    spreadsheet: "Lead Outreach"
    worksheet: "leads"
    service_account_file: service_account.json

