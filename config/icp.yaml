# Industry -> keywords found on the site, and the needs they usually imply.
industries:
  education:     {keywords: [coaching, institute, academy, tuition, classes, school, college, training centre, training center], needs: [crm, automation, custom_app]}
  healthcare:    {keywords: [clinic, hospital, diagnostic, pathology, dental, physiotherapy, nursing home, pharmacy], needs: [automation, website, crm]}
  real_estate:   {keywords: [real estate, builders, developers, properties, apartments, plots, realty], needs: [crm, website]}
  manufacturing: {keywords: [manufacturer, manufacturing, factory, industries, fabrication, plant, foundry], needs: [erp, automation]}
  distribution:  {keywords: [distributor, wholesaler, wholesale, dealer, stockist, supplier, trading, traders], needs: [erp, automation]}
  hospitality:   {keywords: [hotel, resort, restaurant, cafe, caterer, catering, banquet], needs: [website, automation]}
  retail:        {keywords: [showroom, store, boutique, jewellers, jewellery, furniture, electronics, mart], needs: [website, automation, erp]}
  logistics:     {keywords: [logistics, transport, courier, packers and movers, cargo, fleet], needs: [custom_app, erp]}
  professional:  {keywords: [chartered accountant, ca firm, law firm, advocates, consultancy, consultants, tax], needs: [website, crm]}
  interiors:     {keywords: [interior, architect, modular kitchen, construction], needs: [website, crm]}
  travel:        {keywords: [travel agency, tours and travels, tour operator, holidays], needs: [website, crm, automation]}
  events:        {keywords: [event management, events, wedding planner, exhibition, summit], needs: [website, registration, custom_app]}
  startup:       {keywords: [startup, saas, platform, incubated, founders, seed funded], needs: [custom_app, website]}

# Search query generation. {industry} and {city} are filled in; Odisha cities are tried first.
query_industries: [coaching institute, clinic, diagnostic centre, real estate developer, manufacturer,
                   distributor, hotel, restaurant, furniture showroom, interior designer, travel agency,
                   CA firm, logistics company, event management, school, jewellers]
query_templates:
  - "{industry} in {city}"
  - "{industry} {city} contact"
  - "\"{city}\" {industry} \"whatsapp us\""
  - "site:indiamart.com {industry} {city}"
  - "site:justdial.com {industry} {city}"
  - "startup {city} hiring operations"
# Share of queries drawn from each city group (rest from Odisha).
city_mix: {odisha: 0.5, tier2: 0.2, tier3: 0.2, metro: 0.1}
