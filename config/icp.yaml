  startup:       {keywords: [startup, saas, platform, incubated, founders, seed funded], needs: [custom_app, website]}

# Search query generation. {industry} and {city} are filled in.
# Lead quality first: every template is aimed at a business's OWN website (contact/about pages,
# "Pvt Ltd", WhatsApp ordering), not at directories. Justdial/IndiaMART `site:` queries were removed:
# they mostly returned category pages and listings with no website of their own.
# Industries chosen for real B2B need (ERP/CRM/automation); wedding/event, restaurant and hotel
# queries were dropped because they mostly surfaced directories and aggregators.
query_industries: [coaching institute, diagnostic centre, dental clinic, nursing home, real estate developer,
                   construction company, manufacturer, steel fabrication, rice mill, cashew processing,
                   seafood exporter, handloom weavers, distributor, wholesaler, pharma distributor,
                   furniture manufacturer, interior designer, travel agency, CA firm, logistics company,
                   transport company, school, packaging company, printing press, solar installer,
                   agricultural equipment dealer, IT training institute]
query_templates:
  - "{industry} {city} \"contact us\""
  - "{industry} {city} \"about us\""
  - "\"{city}\" {industry} \"whatsapp\""
  - "{industry} {city} \"pvt ltd\""
  - "{industry} in {city} \"enquiry\""
  - "{industry} {city} official website"
# Appended to every query as -site:<domain> (DuckDuckGo operator), so result slots aren't wasted on
# directories. Keep it short: very long queries return worse results. skip_domains still applies.
query_exclude_sites: [justdial.com, indiamart.com, sulekha.com, tradeindia.com, wedmegood.com, weddingwire.in]
# Share of queries drawn from each city group: Odisha first, then Tier-2/3. Metros are off
# (big-city firms are rarely the ICP and their results are dominated by directories).
city_mix: {odisha: 0.6, tier2: 0.2, tier3: 0.2, metro: 0.0}
