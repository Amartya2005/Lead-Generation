# ---------------------------------------------------------------------------
# PORTFOLIO: the ONLY work the Email Agent is allowed to mention.
#
# Rules enforced in code:
#   * An email may link only to domains listed here (plus SENDER_WEBSITE).
#   * Emails citing a project with `confirmed: false` are drafted but NEVER sent.
#     Review each description, make it exact, then set `confirmed: true`.
#   * Do not add results, metrics or client names you cannot back up.
#
# capabilities: what the project shows you can do. Used by the Matching Agent.
#   website | automation | crm | erp | custom_app | event | community | registration
# kind: client (work for someone else) is preferred as an example over
#       own_company / personal sites.
# ---------------------------------------------------------------------------
projects:
  - id: collectiq
    name: CollectIQ Services
    domain: collectiqservices.com
    url: https://collectiqservices.com
    kind: client
    description: "the website, CRM/ERP system, workflow automation and custom app for CollectIQ Services"
    capabilities: [website, crm, erp, automation, custom_app]
    industries: []          # optional, e.g. [finance, services]: boosts matching for that industry
    confirmed: false

