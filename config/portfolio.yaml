# ---------------------------------------------------------------------------
# PORTFOLIO: the ONLY work the Matching and Email agents are allowed to use.
#
# EVERY PROJECT MUST BE CONFIRMED BY A HUMAN BEFORE IT IS USED:
#   * `confirmed: false` -> the Matching Agent ignores the project completely: no lead is matched
#     to it and no draft cites it. Qualified leads wait (match_reason "waiting for portfolio
#     confirmation") and are matched automatically on the next run once you confirm.
#   * Check each description against the live site, then set `confirmed: true` yourself.
#     `python main.py portfolio` shows what is confirmed and what is still blocking drafts.
#
# Description rules (checked on load; a confirmed project that breaks them is treated as UNconfirmed
# and flagged by `python main.py portfolio` and on the review page's dashboard):
#   * at most 120 characters, one plain sentence fragment ("the website and booking system for X")
#   * only what was actually built and is visible: no numbers, results, metrics, client names you
#     can't back up, "award-winning", "leading", etc. The text is pasted into emails verbatim.
#
# capabilities: what the project shows you can do. Used by the Matching Agent.
#   website | automation | crm | erp | custom_app | event | community | registration
# kind: client (work for someone else) is preferred as an example over
#       own_company / personal sites.
# owner: (personal sites only) the team.yaml member id allowed to cite it.
# ---------------------------------------------------------------------------
projects:
  - id: collectiq
    name: CollectIQ Services
    domain: collectiqservices.com
    url: https://collectiqservices.com
    kind: client
    description: "the website, CRM/ERP system, workflow automation and custom app for CollectIQ Services"
    capabilities: [website, crm, erp, automation, custom_app]
    industries: []          # optional, e.g. [finance, services]: boosts matching for that industry
    confirmed: false

  - id: startupjathara
    name: Startup Jathara
    domain: startupjathara.com
    url: https://startupjathara.com
    kind: client
    description: "the Startup Jathara event website, with a community platform and online registration system"
    capabilities: [website, event, community, registration, custom_app]
    industries: [events, startup]
    confirmed: false

  - id: focustrigger
    name: FocusTrigger Automation
    domain: focustriggerautomation.com
    url: https://focustriggerautomation.com
    kind: own_company
    description: "our company site, covering the business automation, website and CRM/ERP work we do"
    capabilities: [automation, website, crm, erp]
    industries: []
    confirmed: false

  - id: amartya
    name: Amartya portfolio
    domain: amartya.focustriggerautomation.com
    url: https://amartya.focustriggerautomation.com
    kind: personal
    owner: amartya          # team.yaml member id: only this person's emails may cite "my portfolio"
    description: "my portfolio of business websites, automation demos and custom apps"
    capabilities: [website, automation, custom_app]
    industries: []
    confirmed: false
